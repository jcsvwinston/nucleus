name: Release Asset Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (e.g. v0.5.0-rc1)"
        required: true
        type: string

# The three jobs download already published assets with `gh release download`,
# which only reads the releases API. Nothing is written back.
permissions:
  contents: read

jobs:
  # Running the binary proves it works. It does not prove it is ours: an
  # asset swapped on the release page runs just as happily. This job asks the
  # other question first, and the smokes below only run once it has answered
  # it — the archives they download are the ones the checksum file we proved
  # authentic covers.
  provenance:
    name: Signature And Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download the checksum file, its signature and one archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify
          VERSION="${TAG#v}"
          PKG="nucleus_${VERSION}_linux_amd64.tar.gz"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify \
            --pattern checksums.txt \
            --pattern checksums.txt.sig \
            --pattern checksums.txt.pem \
            --pattern "$PKG"
          for f in checksums.txt checksums.txt.sig checksums.txt.pem "$PKG"; do
            if [ ! -f "verify/$f" ]; then
              echo "::error::release $TAG publishes no $f — a release cut before signing was added cannot be verified"
              exit 1
            fi
          done

      # The identity is anchored to the TAG, not to main. Release Please
      # chains the release workflow with `gh workflow run --ref <tag>`, so the
      # OIDC token that signed these artifacts was minted at the tag ref and
      # the certificate's subject ends in `@refs/tags/<tag>`. The identity
      # every cosign example shows — `@refs/heads/main` — verifies nothing
      # here.
      - name: Verify the signature over the checksum file
        run: |
          set -euo pipefail
          cosign verify-blob verify/checksums.txt \
            --signature verify/checksums.txt.sig \
            --certificate verify/checksums.txt.pem \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"

      # The signature covers the checksum file; the checksum file covers the
      # archive. This is the step that carries the trust across.
      - name: Verify the archive against the signed checksum file
        run: |
          set -euo pipefail
          cd verify
          awk -v f="$PKG" '$2 == f' checksums.txt | tee matched.txt
          sha256sum -c matched.txt

      - name: Verify the build provenance of the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify "verify/$PKG" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

  linux:
    name: Linux Asset Smoke
    needs: provenance
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download and Run Linux Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-test
          VERSION="${TAG#v}"
          PKG="nucleus_${VERSION}_linux_amd64.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PKG" --dir dist-test
          tar -xzf "dist-test/$PKG" -C dist-test
          chmod +x dist-test/nucleus
          dist-test/nucleus version | tee version.txt
          grep -F "nucleus $VERSION" version.txt

  macos:
    name: macOS Asset Smoke
    needs: provenance
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download and Run macOS Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-test
          VERSION="${TAG#v}"
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            PKG="nucleus_${VERSION}_darwin_arm64.tar.gz"
          else
            PKG="nucleus_${VERSION}_darwin_amd64.tar.gz"
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PKG" --dir dist-test
          tar -xzf "dist-test/$PKG" -C dist-test
          chmod +x dist-test/nucleus
          dist-test/nucleus version | tee version.txt
          grep -F "nucleus $VERSION" version.txt

  windows:
    name: Windows Asset Smoke
    needs: provenance
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download and Run Windows Binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path dist-test -Force | Out-Null
          $version = $env:TAG.TrimStart('v')
          $pkg = "nucleus_${version}_windows_amd64.zip"
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --pattern $pkg --dir dist-test
          Expand-Archive -Path "dist-test/$pkg" -DestinationPath dist-test -Force
          $output = & "./dist-test/nucleus.exe" version
          $output | Tee-Object -FilePath version.txt
          if (-not ($output -match "nucleus $version")) {
            throw "unexpected version output: $output"
          }
