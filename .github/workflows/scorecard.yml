name: OpenSSF Scorecard

# Supply-chain hygiene, measured instead of assumed. The run reports; it does
# not gate. Nothing here fails a pull request: the checks that come out low are
# fixed one at a time.
#
# Two things come out of the run. The SARIF goes to code scanning, one alert
# per check that falls below the action's bundled policy — that is where a
# finding is read, and on 2026-09-08 there were none. The score is not in it:
# a SARIF only carries what failed, so the aggregate is read from the JSON
# format instead, uploaded as the `scorecard-json` artifact and printed as the
# first heading of the job summary.
on:
  schedule:
    # Weekly, Monday early. Scorecard reads repository settings and release
    # history, so a daily run would report the same number all week.
    - cron: "27 6 * * 1"
  workflow_dispatch:

# Nothing in this workflow writes to the repository, so the default for every
# job is read-only. The one job below re-declares what it needs; a job-level
# block replaces this one rather than adding to it.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Publish the findings as code-scanning alerts.
      security-events: write
      # The OIDC token the action uses to sign the results when
      # `publish_results` is on. It is off below, so the token is not spent
      # today; the permission is declared because flipping that flag must not
      # also require a permissions change to work.
      id-token: write
      contents: read
      # Scorecard lists workflow runs to decide CI-Tests, Maintained and which
      # SAST tool (if any) is wired up. Branch-Protection does NOT come from
      # here -- see the token note on the analysis step.
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard analyses the checked-out tree; it never pushes, and a
          # credential left in .git/config would be readable by every step.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Branch-Protection needs an admin-scoped read, and `main` is on
          # classic branch protection rather than the newer repository rules.
          # The default GITHUB_TOKEN cannot supply it: `administration` is not
          # one of the scopes a `permissions:` block can grant it (actionlint
          # rejects the key outright), so no amount of tuning the block above
          # makes that check readable. The action's own documentation asks for
          # a fine-grained PAT with `Administration: Read-only`, stored as the
          # SCORECARD_TOKEN secret.
          #
          # That secret is not set today, and an empty `repo_token` would
          # override the action's default instead of falling back to it. The
          # `||` keeps the run working either way: with no secret configured
          # this is exactly the default GITHUB_TOKEN and Branch-Protection goes
          # unread; the day the owner adds the PAT, the check starts reporting
          # with no edit to this file.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          # Publishing sends the score to the public OpenSSF dataset, where
          # anyone can read it and the badge and the umbrella guard can query
          # it without a token. That is a decision for the repository owner,
          # not for this workflow, so it stays off and the first score is read
          # from this run's own output and from the alerts uploaded below.
          publish_results: false

      - name: Upload results as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

      # A Scorecard SARIF carries only the checks that fall below the action's
      # bundled policy: this repository cleared it on 2026-09-08 and the file
      # came back with zero findings and, of course, no number. The aggregate
      # lives only in the JSON format, and `results_format` takes one value per
      # run — the action analyses once and writes once (`scorecard.Run` then
      # `scorecard.Format` in its main.go), and the one place it formats the
      # same result twice is inside the `publish_results: true` branch, which
      # also signs that JSON and posts it to the public dataset. That is the
      # decision left untaken above, so the score costs a second analysis:
      # about twelve seconds, once a week.
      - name: Run the analysis again for the score
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          # The same token expression as the SARIF run above, deliberately: two
          # analyses reading the repository through different tokens would
          # disagree about Branch-Protection, and the summary would contradict
          # the alerts.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: false

      - name: Upload the JSON results as an artifact
        # Named the same in quark, nucleus and orbit so a later guard can read
        # the scores without a per-repository special case.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-json
          path: results.json
          retention-days: 30

      - name: Report the score in the run summary
        # The score is not published, so the run has to be readable on its own.
        # Every value comes from the results file; nothing from the event
        # context is interpolated into this shell, which is what keeps the
        # Dangerous-Workflow check where it is. Nothing here fails the job
        # either: there is no approved threshold yet, and producing the number
        # the owner needs in order to pick one is the point of the step.
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          try:
              with open("results.json", encoding="utf-8") as handle:
                  data = json.load(handle)
          except Exception as exc:  # the analysis did not get as far as a file
              print("## OpenSSF Scorecard\n")
              print(f"The JSON results could not be read, so there is no score: {exc}")
              raise SystemExit(0)


          def cell(value):
              """One markdown table cell: no newlines, no unescaped pipes."""
              return " ".join(str(value).split()).replace("|", "\\|")


          checks = data.get("checks") or []
          score = data.get("score")
          repo = (data.get("repo") or {}).get("name") or "?"
          commit = ((data.get("repo") or {}).get("commit") or "?")[:12]
          version = (data.get("scorecard") or {}).get("version") or "?"

          print("## OpenSSF Scorecard\n")
          if isinstance(score, (int, float)):
              print(f"### {score:.1f} / 10\n")
          else:
              print("### No aggregate score in the results\n")
          print(f"`{repo}` at `{commit}` — scorecard {version}, {data.get('date', 'unknown date')}\n")
          print("This run measures; it does not gate. No threshold is enforced here.\n")

          if not checks:
              print("The results carry no checks.")
              raise SystemExit(0)


          def rank(check):
              value = check.get("score")
              if isinstance(value, (int, float)) and value >= 0:
                  return (0, value, check.get("name") or "")
              return (1, 0, check.get("name") or "")


          print("| Check | Score | Reason |")
          print("|---|---|---|")
          for check in sorted(checks, key=rank):
              value = check.get("score")
              if isinstance(value, (int, float)) and value >= 0:
                  shown = f"{value:g}/10"
              else:
                  shown = "n/a"
              print(f"| {cell(check.get('name') or '?')} | {shown} | {cell(check.get('reason') or '')} |")

          skipped = [c for c in checks if not isinstance(c.get("score"), (int, float)) or c.get("score") < 0]
          if skipped:
              names = ", ".join(sorted(cell(c.get("name") or "?") for c in skipped))
              print(
                  f"\n`n/a` — the check did not apply to this repository and is left "
                  f"out of the aggregate ({len(skipped)} of {len(checks)}): {names}."
              )
          PY
