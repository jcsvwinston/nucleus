name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least-privilege token. Without this block every job runs with the default
# token, which is write-enabled on repositories that have not restricted it.
# All 18 jobs here only read: checkout, Go module downloads, service
# containers and artifact uploads (the artifact API uses the runtime token,
# not this one). No job calls `gh`, pushes a branch or touches the releases
# API, so no job raises this.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test And Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Go Modules
        run: go mod verify

      - name: PR title in English (QADR-0007)
        # The squash title becomes the changelog line and the release note
        # of an English-speaking product (QM-18). The title goes through an
        # env var, never through the shell line: it is user input.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/ci/check_pr_title_english.sh

      - name: Check version claims in canonical docs
        # Forcing function against doc/version drift (NU-P0-2): README/SPEC/
        # intro version claims must match .release-please-manifest.json.
        # release-please rewrites the marked lines on each release PR via
        # extra-files, so this only fails on hand-edited or unmarked claims.
        run: ./scripts/ci/check_version_claims.sh

      - name: Check the docs archive keeps up with the releases
        # The site serves the current docs plus a snapshot per published
        # minor. That archive silently froze for eight minors: the version
        # picker offered old releases and jumped to current, with a gap it
        # never mentioned. A minor released without its snapshot now fails.
        run: bash scripts/ci/check_docs_archive_freshness.sh

      - name: Check the internal docs do not cite files that are gone
        # The public site has a drift guard; docs/** had none, and it showed:
        # the developer manual described an admin panel extracted from the
        # core fourteen months earlier, linking a file that never existed.
        # Historical records (adrs/, audits/, reports/) are exempt on purpose.
        run: bash scripts/ci/check_internal_docs_drift.sh

      - name: Check the published docs speak the reader's language
        # Keeps internal engineering vocabulary out of website/docs/**. A
        # reader evaluating Nucleus does not know what ADR-010 is, what "P0"
        # means, or that SPEC.md and CLAUDE.md exist — those are artefacts of
        # how we build the framework, not of how anyone uses it. The internal
        # tree is untouched by this rule; only what we publish has to speak
        # the reader's language.
        run: bash scripts/ci/check_docs_product_voice.sh

      # Prose drifts silently. Each pattern in this guard is a sentence that
      # was true once and stood for a release after the code left it behind
      # ("MSSQL sits behind -tags mssql", "a single Go module", a mount
      # method removed in v0.12.0). A reader who meets one on the first
      # screen and then meets `nucleus add sqlserver` stops trusting both.
      - name: Check the living docs carry no retired claims
        run: bash scripts/ci/check_retired_claims.sh

      - name: Check every ADR is in the index
        # The index sat at ADR-022 while the directory held 29: seventeen
        # decisions were reachable only by listing the directory, which is
        # exactly the state an index exists to prevent. It rotted for five
        # arcs because nothing was watching it.
        run: bash scripts/ci/check_adr_index.sh

      - name: Check each versioned docs snapshot announces its own version
        # The snapshot freezes the docs as they are in main, where the
        # version marker still says the PREVIOUS release — release-please
        # raises it later, on its own branch. Five snapshots shipped
        # announcing a version that was not theirs, on the page the site
        # publishes at its root.
        run: bash scripts/ci/check_versioned_docs_markers.sh

      - name: Check the generated configuration reference is fresh
        # website/docs/reference/configuration.md is GENERATED from
        # docs/reference/CONFIG_KEY_REGISTRY.md by
        # scripts/website/gen-config-reference. Anti-drift gate: editing the
        # registry without regenerating — or hand-editing the generated
        # page — must fail loudly, not ship a stale reference.
        run: |
          go run ./scripts/website/gen-config-reference
          git diff --exit-code website/docs/reference/configuration.md

      - name: Check every action is pinned to a commit SHA
        # The pins across the nine workflows were placed by hand (#492) and
        # held by review alone: nothing stopped the next `uses: foo@v4` from
        # landing. A tag is a pointer its owner can move under a job that has
        # this repository checked out — release.yml signs and attests from
        # such a job. The trailing `# vX.Y.Z` is part of the rule, not a
        # nicety: it is what Dependabot reads to know which release a SHA is,
        # and what it rewrites when it proposes the next one.
        run: bash scripts/ci/check_action_pins.sh

      - name: Lint the workflows themselves
        # Until now a malformed workflow was found by running it — on main,
        # after the merge. actionlint parses all nine here: unknown keys,
        # bad `needs:`/matrix references, expressions that name a context
        # that does not exist, and (via the shellcheck that ubuntu-latest
        # ships) the `run:` scripts. Pinned to an exact version for the same
        # reason as govulncheck below and as the action pins above — a
        # floating @latest in CI is what the previous step forbids in
        # spirit. Reproduce locally with `make check`; without shellcheck
        # installed the script half is skipped, which is the one difference
        # from this job.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -no-color

      - name: Run Go Tests
        run: go test ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Build
        run: go build ./...

      - name: Run Core Race Tests
        run: go test -race ./pkg/... ./internal/cli

      # A module's go.mod lists every module its own tests import, and the
      # framework's go.mod is the one every application inherits. What the
      # tests need and that go.mod must not list — the engines' real error
      # types, the miniredis server internal/testredis starts — lives in
      # internal/testdeps, a module that is never published (NU-106). Its
      # tests run here, with the root's.
      - name: Run the tests that live outside the framework's module
        working-directory: internal/testdeps
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          go test ./...

      - name: Replay the fuzz seed corpora
        # The fuzz targets cover the surfaces that take untrusted input: the
        # router's path handling and the Matched decision every security gate
        # consults, the CSRF/origin gate, the forwarding headers behind
        # RealIP, the bearer token, and the ORDER BY expression that reaches
        # the SQL text. Each asserts a property, so replaying their corpora is
        # a real check and not a formality — every input that ever broke one
        # is committed under testdata/fuzz and runs here.
        #
        # Replay, not mutation, and the reason is measured: `go test -fuzz`
        # compiles the package and its dependencies with fuzz instrumentation,
        # a build variant nothing else in this job produces. On this runner
        # that was 44s for pkg/router and 36s for pkg/auth against 28s of
        # actual fuzzing — 116s, over the budget for a step on the PR path —
        # and setup-go keys its cache on go.sum, so the instrumented entries
        # are restored but never re-saved, and the cost repeats every run.
        # Mutation therefore lives in fuzz.yml (weekly and on demand, 60s per
        # target) and in `make fuzz`; this step keeps the corpus honest on
        # every PR for a few seconds. The script also guards the false-green
        # both -run and -fuzz share: a renamed target selects nothing and
        # exits 0.
        run: bash scripts/ci/run_fuzz_targets.sh --seeds

      - name: Run govulncheck
        # Pinned to v1.3.0: govulncheck @latest (x/vuln v1.4.0) pulls
        # golang.org/x/tools v0.46.0, whose typesinternal.ForEachElement panics
        # on generic types ("ForEachElement called on type containing
        # *types.TypeParam") under Go 1.26 — which aborts the scan for this
        # generics-heavy module (panic, not a vuln finding). v1.3.0 is the last
        # release that analyses cleanly. Unpin once a newer x/tools fixes the
        # panic. The vulnerability database is fetched at run time, so a pinned
        # binary still scans against current advisories.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  db-matrix-required:
    name: DB Matrix Required (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: postgresql
            database_url: postgres://postgres:postgres@127.0.0.1:5432/nucleus?sslmode=disable
          - profile: mysql
            database_url: mysql://root:root@127.0.0.1:3306/nucleus

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nucleus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nucleus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nucleus
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Guard -run filters still select their tests (MAQ-5)
        # `go test -run '^X$'` exits 0 when it matches NOTHING, so renaming a
        # pinned test silently drops it from CI while the lane stays green
        # (NU7-4). This build-time guard fails if any -run branch below no
        # longer selects its intended test — before the live steps run.
        run: |
          bash scripts/ci/assert_run_selects.sh ./pkg/db '^TestSQLMatrix_ConnectAndPing$|^TestSQLMatrix_SchemaDrift$|^TestInstrumentLive_WrapsRealDriver$'
          bash scripts/ci/assert_run_selects.sh ./pkg/app '^TestSQLMatrix_AutoMigrate$'
          bash scripts/ci/assert_run_selects.sh ./internal/cli '^TestSQLMatrix_CriticalCommands$'
          bash scripts/ci/assert_run_selects.sh ./pkg/model '^TestCRUDLive_'
          bash scripts/ci/assert_run_selects.sh ./pkg/accounts '^TestSQLMatrix_AccountsStore$'
          bash scripts/ci/assert_run_selects.sh ./pkg/outbox '^TestSQLMatrix_Outbox$'
          bash scripts/ci/assert_run_selects.sh ./pkg/tasks/providers/sql '^TestSQLMatrix_JobsProvider$'
          bash scripts/ci/assert_run_selects.sh ./pkg/tasks/providers/sql '^TestSQLProvider_GateDurabilityUnderCrash$'
          bash scripts/ci/assert_run_selects.sh ./pkg/tasks/providers/sql '^TestSQLMatrix_JobsClaimsDoNotCollide$|^TestSQLMatrix_JobsQueueScalesWithWorkers$|^TestSQLMatrix_JobsClaimCostDoesNotGrowWithTheBacklog$'

      # The framework's tests link SQLite alone, so its go.mod — the one every
      # application inherits — lists no other engine (NU-106).
      # test_with_engines.sh links PostgreSQL, MySQL, SQL Server and Oracle on
      # top, through their driver modules, for the steps that connect to one;
      # a step that forgot it fails with the framework's "import _
      # .../drivers/postgres" error rather than passing.
      - name: Run DB runtime smoke
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        # InstrumentLive: the W2 driver-wrapper live test reads
        # NUCLEUS_SQL_MATRIX_URL and only accepts the required profiles
        # (postgres/mysql), but since v1.3.0 no lane's -run filter included
        # it, so it had never executed against a real engine in CI (NU7-4).
        run: bash scripts/ci/test_with_engines.sh ./pkg/db -run '^TestSQLMatrix_ConnectAndPing$|^TestSQLMatrix_SchemaDrift$|^TestInstrumentLive_WrapsRealDriver$' -v

      - name: Run App AutoMigrate live smoke
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./pkg/app -run '^TestSQLMatrix_AutoMigrate$' -v
      - name: Test kit (Transactional against the matrix engine)
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./pkg/nucleustest -run '^TestTransactionalOnTheMatrixDatabase$' -v

      - name: Run CLI critical command smoke
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./internal/cli -run '^TestSQLMatrix_CriticalCommands$' -v

      # The accounts store declares three dialects and its unit tests
      # exercise one. What differs between them is exactly what is silent on
      # SQLite: placeholder syntax, timestamp types, how a driver reports a
      # unique violation, and whether a conditional UPDATE reports rows
      # affected — which is what makes a reset token single-use.
      - name: Run accounts store live smoke
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./pkg/accounts -run '^TestSQLMatrix_AccountsStore$' -v

      # The outbox declares three dialects and its unit tests exercise one,
      # which is how NU-85 shipped: a CREATE INDEX IF NOT EXISTS that MySQL
      # does not have, emitted from inside NewStore, so an application with the
      # outbox enabled could not open a MySQL database at all. This lane is
      # where a defect of that shape is visible, and until now it did not run
      # pkg/outbox.
      - name: Run outbox live smoke
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./pkg/outbox -run '^TestSQLMatrix_Outbox$' -v

      # The durable jobs queue: its DDL, its claim and its timestamp handling
      # would otherwise only ever run on SQLite, which is the exact shape of
      # NU-85 — a statement that is valid on one engine and a syntax error on
      # another, emitted from a constructor.
      - name: Run durable jobs queue live smoke
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./pkg/tasks/providers/sql -run '^TestSQLMatrix_JobsProvider$' -v

      # The gate of arc A7: 10 000 jobs, the worker killed mid-flight with
      # SIGKILL, and nothing lost. It runs on SQLite — what it measures is the
      # RECOVERY, a lease expiring under a process that is gone, and SQLite,
      # with its single writer, is where a crash is hardest — and, since NU-87,
      # on the matrix engine as well: PostgreSQL and MySQL claim with SKIP
      # LOCKED, a different statement from SQLite's, and a gate that only ran
      # on SQLite would say nothing about whether that claim loses work.
      # Without this step the provider could stop recovering while every
      # other test stayed green.
      - name: Run the jobs durability gate (10k jobs, killed mid-flight)
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./pkg/tasks/providers/sql -run '^TestSQLProvider_GateDurabilityUnderCrash$' -v -timeout 15m

      # NU-87: the claim used to serialise on the head of the queue, so
      # sixteen workers drained it no faster than one. None of these measures
      # a rate, which would measure the runner (NU-95). With free work in the
      # queue, at most 5 % of sixteen workers' claims may come back empty —
      # a share, which the host cannot move. Sixteen workers must drain the
      # queue at least twice as fast as one — a ratio on this host; a
      # four-vCPU runner saturates at about four workers, so the floor is two
      # rather than the four a workstation shows. A backlog of twenty thousand
      # jobs must not slow the claim to less than half.
      - name: Run the jobs queue throughput tests
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./pkg/tasks/providers/sql -run '^TestSQLMatrix_JobsClaimsDoNotCollide$|^TestSQLMatrix_JobsQueueScalesWithWorkers$|^TestSQLMatrix_JobsClaimCostDoesNotGrowWithTheBacklog$' -v -timeout 15m

      # The whole TestCRUDLive_ family, not one hand-picked test: the narrow
      # filter is how the RETURNING-path scenarios (string/UUID PK, no PK,
      # insert-event row count) would silently stay out of the only lane with
      # a real Postgres (5ª ronda: NU5-2/NU5-5).
      - name: Run model CRUD live matrix
        env:
          NUCLEUS_SQL_MATRIX_URL: ${{ matrix.database_url }}
        run: bash scripts/ci/test_with_engines.sh ./pkg/model -run '^TestCRUDLive_' -v

  jobs-redis:
    name: Module Jobs (real Redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Guard -run filter still selects its test (MAQ-5)
        # See db-matrix-required for the rationale (NU7-4 false-green).
        run: bash scripts/ci/assert_run_selects.sh ./pkg/nucleus '^TestJobsStart_AsynqAgainstRealRedis$'

      # The asynq jobs provider against a REAL Redis server, not just
      # miniredis: the same registration→schedule→enqueue→worker→handler
      # scenario the in-process test runs, plus the pkg/tasks provider
      # stop-path regression pins. Env-gated tests — without
      # NUCLEUS_JOBS_REDIS_URL they self-skip, so this lane is the only
      # place they execute.
      - name: Run module-jobs asynq scenario against real Redis
        env:
          NUCLEUS_JOBS_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test ./pkg/nucleus -run '^TestJobsStart_AsynqAgainstRealRedis$' -count=1 -v

      - name: Guard -run filter still selects the cache tests (MAQ-5)
        run: |
          bash scripts/ci/assert_run_selects.sh ./pkg/cache/rediscache '^TestRedisLive_SharedBetweenInstances$'
          bash scripts/ci/assert_run_selects.sh ./internal/catalogbench '^TestCatalogBench$'

      # The Redis backend of pkg/cache against the same real server: two
      # caches share a key, the expiry is the server's, a delete on one is
      # seen by the other. Without NUCLEUS_CACHE_REDIS_URL it self-skips.
      - name: Run the Redis cache backend against real Redis
        env:
          NUCLEUS_CACHE_REDIS_URL: redis://127.0.0.1:6379/1
        run: go test ./pkg/cache/rediscache -run '^TestRedisLive_SharedBetweenInstances$' -count=1 -v

      # EN-06 of the catalog bench on a real server: the api starter with
      # `nucleus add redis-cache`, two instances of it, a value written
      # through the framework's cache in one and read in the other. The main
      # lane measures it against miniredis; a subtest filter that matches
      # nothing exits 0, so the step checks that EN-06 ran and measured this
      # server.
      - name: Run the catalog bench's redis-cache entry against real Redis
        env:
          NUCLEUS_CACHE_REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          set -o pipefail
          go test ./internal/catalogbench/ -run '^TestCatalogBench$/^EN-06$' -count=1 -v | tee en06.log
          grep -q -- '--- PASS: TestCatalogBench/EN-06' en06.log || { echo "EN-06 did not run: renamed, or skipped"; exit 1; }
          grep -q 'against a real Redis' en06.log || { echo "EN-06 did not measure the real server"; exit 1; }

      # The durability gate is skipped here and nowhere else. It has its own
      # step in the main lane ("Run the jobs durability gate"), it exercises
      # the SQL provider and never touches Redis, and it is the heaviest test
      # in the tree — ten thousand jobs and a killed worker. Running it a
      # second time on a host that is also running Redis containers buys
      # nothing and is where it ran out of budget with the queue working
      # perfectly (pending=694, done=9305, still advancing).
      - name: Run pkg/tasks asynq provider suite
        run: go test ./pkg/tasks/... -count=1 -skip '^TestSQLProvider_GateDurabilityUnderCrash$'

  storage-minio:
    name: Storage S3 (real server, RustFS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      # The live S3 suite moved with its implementation (ADR-030): it names
      # S3Store's internals, which only its own module can. Link the module
      # to this tree first, the same reason the other provider lanes do.
      - name: Link the S3 provider to this tree
        run: go work init . providers/storage-s3

      - name: Guard -run filter still selects its test (MAQ-5)
        # See db-matrix-required for the rationale (NU7-4 false-green).
        working-directory: providers/storage-s3
        run: bash ../../scripts/ci/assert_run_selects.sh ./... '^TestS3Live_MinIO$'

      # A real S3 server, started explicitly instead of as a service
      # container so the run can be told where its data goes. It is RustFS
      # since 2026-09-26: MinIO stopped publishing its container image —
      # Docker Hub first (no tags), then quay.io answered 401 to anonymous
      # pulls of every tag — and this lane went red on every pull request
      # for something that had nothing to do with the change under review.
      # RustFS is a MinIO-compatible S3 server (Apache-2.0) whose image is
      # public; the six live tests pass against it unchanged. Pinned by
      # digest (rustfs/rustfs:1.0.0, 2026-09-16); the credentials travel in
      # RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY and the test keeps the endpoint
      # variable it has always read.
      - name: Start RustFS (S3-compatible)
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=minioadmin \
            -e RUSTFS_SECRET_KEY=minioadmin \
            rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/health >/dev/null; then
              echo "RustFS is ready"
              exit 0
            fi
            sleep 2
          done
          echo "RustFS did not become healthy on :9000"
          docker logs rustfs
          exit 1

      # The S3 store against a real S3 API: Put/Get/Exists/Delete plus the
      # issue #227 pin — Get/Exists of a missing key must map to
      # storage.ErrNotFound. The text-matching not-found classifier survived
      # to v1.4.0 because the unit tests fabricated errors with "NoSuchKey"
      # in the text; a real endpoint says "The specified key does not
      # exist." and carries the code only in the typed response. This lane
      # is the one that fails on that class of bug.
      - name: Run storage live suite against a real S3 server (RustFS)
        working-directory: providers/storage-s3
        env:
          NUCLEUS_STORAGE_MINIO_URL: http://minioadmin:minioadmin@127.0.0.1:9000
        run: go test ./... -run '^TestS3Live_MinIO$' -count=1 -v

  providers-storage-secrets:
    name: Provider modules (storage, secrets, errors)
    runs-on: ubuntu-latest

    # The cloud backends are SEPARATE modules (ADR-030), so the root
    # `go test ./...` does not reach them. Without this lane they would ship
    # untested — and they are the code that talks to the object store an
    # application keeps its uploads in. The Sentry reporter is one too, and
    # its tests need this tree in particular: the error behind a 500 reaches
    # it through interceptor.ErrorReporter, which its pinned release predates.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Link the modules to the tree under review, the same reason the LDAP
      # lane does it: their go.mod pins a PUBLISHED nucleus, so without the
      # workspace a change to pkg/storage in this very PR would be tested
      # against the previous release instead of against itself. Standalone
      # resolution is a separate question, answered when the root is tagged
      # (the module-and-API-in-the-same-train rule from ADR-024).
      - name: Link the provider modules to this tree
        run: go work init . providers/storage-s3 providers/storage-gcs providers/storage-azure providers/secrets-aws providers/errors-sentry

      - name: Build and vet
        run: |
          set -euo pipefail
          for m in providers/storage-s3 providers/storage-gcs providers/storage-azure providers/secrets-aws providers/errors-sentry; do
            echo "== $m"
            (cd "$m" && go build ./... && go vet ./...)
          done

      - name: Test
        run: |
          set -euo pipefail
          for m in providers/storage-s3 providers/storage-gcs providers/storage-azure providers/secrets-aws providers/errors-sentry; do
            echo "== $m"
            (cd "$m" && go test ./...)
          done

      # The point of the split, asserted rather than assumed: the framework
      # must not link a cloud SDK. If one creeps back in through a new import,
      # this fails and names it.
      - name: The core links no cloud SDK
        run: |
          set -euo pipefail
          if go list -deps ./pkg/app 2>/dev/null | grep -E 'aws-sdk-go|azure-sdk-for-go|cloud\.google\.com/go/storage|minio-go'; then
            echo "::error::a cloud SDK is reachable from pkg/app again — that is what ADR-030 removed" >&2
            exit 1
          fi
          echo "OK: no cloud SDK reachable from pkg/app"
          if go list -deps ./pkg/app 2>/dev/null | grep -E 'getsentry/sentry-go'; then
            echo "::error::the Sentry SDK is reachable from pkg/app — it belongs to providers/errors-sentry alone (ADR-029, ADR-031)" >&2
            exit 1
          fi
          echo "OK: no error-tracking SDK reachable from pkg/app"

  drivers-and-exporters:
    name: Driver and exporter modules
    runs-on: ubuntu-latest

    # The database drivers and the telemetry exporters are SEPARATE modules
    # (ADR-031), so the root `go test ./...` does not reach them. Without this
    # lane they would ship untested — and one of them decides whether a
    # rejected insert is reported as "that email is taken" or as an internal
    # error.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same reason as the provider lanes: their go.mod pins a PUBLISHED
      # nucleus, so without the workspace a change to pkg/db in this very PR
      # would be tested against the previous release instead of against
      # itself.
      - name: Link the modules to this tree
        run: >
          go work init .
          drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle
          exporters/otlp exporters/prometheus

      - name: Build, vet and test
        run: |
          set -euo pipefail
          for m in drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle exporters/otlp exporters/prometheus; do
            echo "== $m"
            (cd "$m" && go build ./... && go vet ./... && go test ./...)
          done

      # The point of the split, asserted rather than assumed. Both halves
      # matter and they fail for different reasons: a driver creeping back
      # into pkg/db, or an exporter creeping back into pkg/observe. gRPC is
      # listed because the OTLP exporter pulls it even over HTTP, and
      # protobuf because Prometheus does through client_golang — neither is
      # obvious from the import that would reintroduce it.
      - name: The core links no driver and no exporter
        run: |
          set -euo pipefail
          if go list -deps ./pkg/app 2>/dev/null | grep -E 'go-sql-driver|jackc/pgx|modernc\.org/sqlite|go-mssqldb|sijms/go-ora'; then
            echo "::error::a database driver is reachable from pkg/app again — that is what ADR-031 removed" >&2
            exit 1
          fi
          if go list -deps ./pkg/app 2>/dev/null | grep -E 'google\.golang\.org/grpc|google\.golang\.org/protobuf|prometheus/client_golang|exporters/otlp'; then
            echo "::error::a telemetry exporter is reachable from pkg/app again — that is what ADR-031 removed" >&2
            exit 1
          fi
          echo "OK: no driver and no exporter reachable from pkg/app"

  modules-standalone:
    name: Sibling modules build standalone
    runs-on: ubuntu-latest
    # The module lanes above link the sibling modules to this tree with a
    # workspace, which is right for testing a change against the module
    # that consumes it and wrong as the only check: a workspace masks a
    # go.mod that does not resolve from the proxy. Eleven modules shipped
    # pinned to a nucleus release that did not yet contain the packages
    # they import, and `cd drivers/sqlite && go build ./...` failed for
    # anyone who tried while CI stayed green. This lane is what a reader
    # gets: workspace off, committed go.mod/go.sum, build and vet.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy, build and vet every sibling module with GOWORK=off
        run: bash scripts/ci/check_modules_standalone.sh

  cli:
    name: CLI module (build, vet, test, race, govulncheck)
    runs-on: ubuntu-latest
    # The CLI is a module of its own (cmd/nucleus/go.mod, A12 N1): it links
    # the five database engines through the driver modules, and keeping that
    # out of the framework's go.mod is what keeps them out of every
    # application's build graph. The root `go test ./...` does not reach a
    # nested module, so this lane is where the binary people install is
    # built and tested — against this tree and its driver modules, through
    # a workspace that also points the CLI's framework requirement here (it
    # names a release, and on a release branch one that does not exist yet).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/nucleus/go.sum

      - name: Link the CLI and the driver modules to this tree
        run: bash scripts/ci/cli_workspace.sh go.work drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle

      - name: Build, vet and test
        working-directory: cmd/nucleus
        run: |
          go build ./...
          go vet ./...
          go test ./...
          go test -race ./...

      # The CLI is the one binary that should link every engine: `nucleus
      # migrate` works against whatever database is in front of it. Asserted
      # on the binary, because a driver module dropped from drivers.go
      # compiles fine and fails only when someone points it at that engine.
      - name: The CLI links all five engines
        working-directory: cmd/nucleus
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/nucleus" .
          deps=$(go version -m "$RUNNER_TEMP/nucleus" | awk '$1 == "dep" {print $2}')
          missing=0
          for m in github.com/jackc/pgx/v5 github.com/go-sql-driver/mysql modernc.org/sqlite github.com/microsoft/go-mssqldb github.com/sijms/go-ora/v2; do
            if ! grep -qx "$m" <<<"$deps"; then
              echo "::error::the CLI does not link $m"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "OK: the CLI links PostgreSQL, MySQL, SQLite, SQL Server and Oracle"

      - name: govulncheck (the CLI)
        working-directory: cmd/nucleus
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  hello-world-size:
    name: The hello-world stays small
    runs-on: ubuntu-latest
    # The hello-world went from 87 to 92 modules after ADR-031 with nothing
    # watching, and the framework's go.mod carried four engines and miniredis
    # that only its tests and the CLI used (NU-106). This lane builds pkg/app
    # alone and pkg/app with drivers/sqlite against this tree and fails when
    # the build list, the linked modules, the packages or the stripped binary
    # pass the ceilings in scripts/ci/hello-size/ceilings.tsv. A ceiling
    # reached on purpose is raised in the pull request that reaches it.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Measure hello and hello+sqlite against their ceilings
        run: bash scripts/ci/check_hello_size.sh

  suite-starter:
    name: Suite starter (scaffold, its own test, boot)
    runs-on: ubuntu-latest
    # `nucleus new --template suite` writes Nucleus, Quark and Orbit wired
    # together, and a test that drives the starter through the test kit. The
    # framework module cannot require Quark or Orbit, so the one test that
    # builds that starter (TestSuiteScaffoldBootsWithSiblingCheckouts) needs
    # their checkouts next to this one — and without them it skips, which is
    # what it did in every run of this workflow until this lane: only the
    # umbrella's workspace lane booted the starter, after the release.
    #
    # Here the siblings are the LATEST RELEASE of each root module, the
    # version a user's `nucleus new --template suite` resolves today, checked
    # out next to this tree; the test pins the scaffold to all three with
    # replace directives, runs `go vet` and the starter's own test, builds
    # it, boots it and walks the API and the admin login. Every step after
    # the checkouts runs in the nucleus directory, so a step that needs
    # another toolchain (the generated TypeScript client the A10 gate asks
    # for) is one more step here.
    steps:
      - name: Checkout nucleus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nucleus

      - name: Resolve the latest release of quark and orbit
        id: siblings
        # Root-module tags only: vX.Y.Z. A module tag carries its path
        # (server/v0.10.5, drivers/sqlite/v1.0.0) and does not match the
        # refs/tags/v* pattern; a pre-release (v2.0.0-rc.1) is filtered out.
        run: |
          set -euo pipefail
          latest() {
            git ls-remote --tags --sort=-v:refname "https://github.com/jcsvwinston/$1" 'refs/tags/v*' \
              | awk '{print $2}' | sed 's#^refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1
          }
          quark="$(latest quark)"
          orbit="$(latest orbit)"
          if [ -z "$quark" ] || [ -z "$orbit" ]; then
            echo "::error::could not resolve a release tag (quark='$quark', orbit='$orbit')"
            exit 1
          fi
          echo "quark=$quark" >> "$GITHUB_OUTPUT"
          echo "orbit=$orbit" >> "$GITHUB_OUTPUT"
          echo "Suite starter built against quark $quark and orbit $orbit" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout quark at its latest release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jcsvwinston/quark
          ref: ${{ steps.siblings.outputs.quark }}
          path: quark

      - name: Checkout orbit at its latest release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jcsvwinston/orbit
          ref: ${{ steps.siblings.outputs.orbit }}
          path: orbit

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: nucleus/go.mod
          cache: true
          cache-dependency-path: nucleus/go.sum

      # The arc A10 gate runs here too: the starter's OpenAPI document, a
      # TypeScript client generated from it, and a script that uses nothing
      # but that client against the booted starter. Node 24 runs the .ts
      # files as they are (type stripping); the TypeScript compiler, pinned,
      # checks the generated client and the script with --strict first.
      - name: Setup Node (runs the generated TypeScript client)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the TypeScript compiler (pinned) for the type check
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tsc"
          npm install --prefix "$RUNNER_TEMP/tsc" --no-save --no-audit --no-fund typescript@5.9.3 @types/node@24.3.0
          echo "NUCLEUS_TSC=$RUNNER_TEMP/tsc/node_modules/.bin/tsc" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/tsc/node_modules" >> "$GITHUB_ENV"

      - name: Guard -run filters still select their tests (MAQ-5)
        working-directory: nucleus
        run: |
          bash scripts/ci/assert_run_selects.sh ./internal/cli '^TestSuiteScaffoldBootsWithSiblingCheckouts$'
          bash scripts/ci/assert_run_selects.sh ./internal/cli '^TestSuiteStarterTypeScriptClient$'
          bash scripts/ci/assert_run_selects.sh ./internal/cli '^TestSuiteStarterDocumentUnderContract$'

      # NUCLEUS_REQUIRE_SIBLING_CHECKOUTS turns the tests' skip into a
      # failure: in this lane a missing sibling — or a missing node — is a
      # broken lane, never a green one.
      - name: Scaffold the suite starter, run its own test, build and boot it
        working-directory: nucleus
        env:
          NUCLEUS_REQUIRE_SIBLING_CHECKOUTS: "1"
        run: go test ./internal/cli/ -run '^TestSuiteScaffoldBootsWithSiblingCheckouts$' -count=1 -v

      - name: The starter's API through the generated TypeScript client (A10 gate)
        working-directory: nucleus
        env:
          NUCLEUS_REQUIRE_SIBLING_CHECKOUTS: "1"
        run: go test ./internal/cli/ -run '^TestSuiteStarterTypeScriptClient$' -count=1 -v

      - name: The starter's document against its frozen baseline
        working-directory: nucleus
        env:
          NUCLEUS_REQUIRE_SIBLING_CHECKOUTS: "1"
        run: go test ./internal/cli/ -run '^TestSuiteStarterDocumentUnderContract$' -count=1 -v

  providers-saml:
    name: SAML Provider (signature checks, standalone, govulncheck)
    runs-on: ubuntu-latest

    # providers/auth-saml is a SEPARATE module (ADR-030/031): the root
    # `go test ./...` does not reach it. It decides who signs in from an XML
    # document a browser carries, so its refusals — an unsigned or forged
    # assertion, another audience, an expired window, a replay, a wrapped
    # signature — are tested here against a stand-in identity provider that
    # signs with its own key.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Linked to this tree, for the same reason as the LDAP lane: a change
      # to pkg/auth in this very PR is tested against the provider that
      # consumes it, not against the release the module pins.
      - name: Link the provider to this tree
        run: go work init . providers/auth-saml

      - name: Build, vet and test against this tree
        working-directory: providers/auth-saml
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1 -race

      # The point of the module, asserted: an application that does not
      # speak SAML links no XML-signature library.
      - name: The core links no SAML library
        run: |
          set -euo pipefail
          if go list -deps ./pkg/app 2>/dev/null | grep -E 'crewjam/saml|russellhaering/goxmldsig|beevik/etree'; then
            echo "::error::a SAML library is reachable from pkg/app — it belongs to providers/auth-saml alone (ADR-030/031)" >&2
            exit 1
          fi
          echo "OK: no SAML library reachable from pkg/app"

      # And without the workspace: the module resolves from the proxy and
      # its tests pass against the release it pins, the way anyone who runs
      # `go get` on it gets it. The vulnerability scan runs on that graph —
      # the one an application inherits — pinned as the root's is.
      - name: Standalone resolution, tests and govulncheck (no workspace)
        working-directory: providers/auth-saml
        env:
          GOWORK: "off"
          GOFLAGS: -mod=readonly
        run: |
          go vet ./...
          go test ./... -count=1
          go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  providers-ldap:
    name: LDAP Provider (real OpenLDAP)
    runs-on: ubuntu-latest

    # providers/ldap is a SEPARATE module: the root `go test ./...` does not
    # reach it, so without this lane it would ship untested. It authenticates
    # people, which makes "untested" the wrong kind of cheap.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Link the module to the tree it is being tested against. Without
      # this the lane compiles against the nucleus version pinned in
      # providers/ldap/go.mod, so a change to pkg/auth in this very PR
      # would sail through green — the lane would be testing a published
      # artefact instead of the change under review. Standalone resolution
      # is proved separately, in the last step.
      - name: Link the provider to this tree
        run: go work init . providers/ldap

      - name: Guard -run filter still selects its tests (MAQ-5)
        working-directory: providers/ldap
        run: bash ../../scripts/ci/assert_run_selects.sh ./... '^TestLive_'

      # A real directory, not a fake. The unit tests drive every branch
      # through an injected connection; only a real server proves the
      # protocol-level properties — what a directory does with an empty
      # password, and that a crafted username cannot widen the filter.
      - name: Start OpenLDAP
        run: |
          docker run -d --name openldap -p 3890:389 \
            -e LDAP_ORGANISATION="Nucleus" \
            -e LDAP_DOMAIN="example.org" \
            -e LDAP_ADMIN_PASSWORD="adminpassword" \
            osixia/openldap:1.5.0
          for _ in $(seq 1 60); do
            if docker exec openldap ldapsearch -x -H ldap://localhost \
                 -b dc=example,dc=org -D "cn=admin,dc=example,dc=org" \
                 -w adminpassword >/dev/null 2>&1; then
              echo "OpenLDAP is ready"
              exit 0
            fi
            sleep 2
          done
          echo "OpenLDAP did not become ready on :3890"
          docker logs openldap
          exit 1

      - name: Seed the directory
        run: |
          docker cp providers/ldap/testdata/seed.ldif openldap:/tmp/seed.ldif
          docker exec openldap ldapadd -x -H ldap://localhost \
            -D "cn=admin,dc=example,dc=org" -w adminpassword -f /tmp/seed.ldif

      - name: Run the provider suite (unit + live)
        working-directory: providers/ldap
        env:
          NUCLEUS_LDAP_URL: ldap://127.0.0.1:3890
        run: go test ./... -count=1 -v

      # And the other half: with the workspace out of the way the module
      # must still resolve its dependencies from the proxy, the way anyone
      # who runs `go get` on it does. Orbit's modules learned this the hard
      # way — a workspace masked a module that did not build standalone all
      # the way to a published tag.
      - name: Standalone resolution (no workspace)
        working-directory: providers/ldap
        env:
          GOWORK: "off"
          GOFLAGS: -mod=readonly
        run: |
          go vet ./...
          go build ./...
          go test ./... -run '^TestNothing$' -count=1

  db-matrix-live-mssql:
    name: DB Matrix Live (mssql)
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "StrongPassw0rd!"
        ports:
          - 1433:1433
        # Gate the job steps on SQL Server actually answering an
        # authenticated `SELECT 1`, not just on the TCP port opening
        # (MAQ-5). The port accepts connections seconds before the engine
        # can serve queries — the login/recovery phase — so a bare port
        # probe reports "ready" too soon, the same startup-race class #235
        # closed for Oracle. sqlcmd ships in the server image at
        # /opt/mssql-tools18/bin/sqlcmd; -C trusts the container's
        # self-signed certificate (driver 18 encrypts by default) and -b
        # makes a failed query set a non-zero exit, so the healthcheck
        # stays red until a real query round-trips. Verified against
        # mcr.microsoft.com/mssql/server:2022-latest: the port opens within
        # a couple of seconds while the healthcheck reports `starting` until
        # SELECT 1 succeeds (~15s), then `healthy`.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassw0rd!' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Guard -run filters still select their tests (MAQ-5)
        # Build-time (-tags mssql), no DB needed; see db-matrix-required for
        # the NU7-4 false-green rationale. Fails fast if a pinned exploratory
        # test was renamed out of its -run filter.
        run: |
          bash scripts/ci/assert_run_selects.sh ./pkg/db '^TestSQLMatrix_ExploratoryLiveConnectAndPing$|^TestSQLMatrix_SchemaDrift_Exploratory$' -tags mssql
          bash scripts/ci/assert_run_selects.sh ./pkg/app '^TestSQLMatrix_AutoMigrate_Exploratory$' -tags mssql
          bash scripts/ci/assert_run_selects.sh ./internal/cli '^TestSQLMatrix_ExploratoryCriticalCommands$|^TestSQLMatrix_ExploratoryAdminUserCommands$' -tags mssql
          bash scripts/ci/assert_run_selects.sh ./pkg/model '^TestCRUDLive_' -tags mssql

      - name: Confirm SQL Server port
        # The service healthcheck above already gates readiness (an
        # authenticated SELECT 1 succeeds), so this is a fast
        # belt-and-suspenders that the mapped port is reachable from the job
        # before the smoke — not the readiness wait it used to be (MAQ-5).
        run: |
          for _ in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server port is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server port not reachable on 1433 despite healthy service"
          exit 1

      - name: Run live smoke (MSSQL)
        env:
          NUCLEUS_SQL_EXPLORATORY_URL: 'sqlserver://sa:StrongPassw0rd!@127.0.0.1:1433/master'
        run: |
          bash scripts/ci/test_with_engines.sh -tags mssql ./pkg/db -run '^TestSQLMatrix_ExploratoryLiveConnectAndPing$|^TestSQLMatrix_SchemaDrift_Exploratory$' -v
          # AdminUserCommands: createuser/changepassword round-trip with the
          # orbit admin schema provisioned — the only lane where their TOP 1
          # lookup branch runs against real T-SQL (NU7-3; the branch shipped
          # in v1.3.3 without ever executing here).
          bash scripts/ci/test_with_engines.sh -tags mssql ./pkg/app -run '^TestSQLMatrix_AutoMigrate_Exploratory$' -v
          bash scripts/ci/test_with_engines.sh -tags mssql ./internal/cli -run '^TestSQLMatrix_ExploratoryCriticalCommands$|^TestSQLMatrix_ExploratoryAdminUserCommands$' -v

      # The OUTPUT INSERTED branch of CRUD.Create shipped in v1.3.1 without
      # ever executing anywhere — this lane ran no CRUD test and the live
      # matrix profile rejected sqlserver URLs. The moment it first ran, the
      # LIMIT-based list queries turned out to be invalid T-SQL too (NU5-4).
      # This step keeps the whole CRUD surface (create+backfill, list, get,
      # update, soft-delete) executing against a real SQL Server.
      - name: Run model CRUD live matrix (MSSQL)
        env:
          NUCLEUS_SQL_MATRIX_URL: 'sqlserver://sa:StrongPassw0rd!@127.0.0.1:1433/master'
        run: bash scripts/ci/test_with_engines.sh -tags mssql ./pkg/model -run '^TestCRUDLive_' -v

  db-matrix-live-oracle:
    name: DB Matrix Live (oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: "oracle"
        ports:
          - 1521:1521
        # The container's own healthcheck.sh (shipped by gvenzl/oracle-free)
        # reports healthy only once the DB is open AND the FREEPDB1 pluggable
        # database service is registered with the listener. GitHub gates the
        # job steps on this healthcheck, so the smoke never runs against a
        # listener that accepts TCP but does not yet know FREEPDB1 — the
        # ORA-12514 startup race (a bare port probe returns "ready" too soon).
        options: >-
          --shm-size=1g
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 90s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Guard -run filters still select their tests (MAQ-5)
        # Build-time (-tags oracle), no DB needed; see db-matrix-required for
        # the NU7-4 false-green rationale. Fails fast if a pinned exploratory
        # test was renamed out of its -run filter.
        run: |
          bash scripts/ci/assert_run_selects.sh ./pkg/db '^TestSQLMatrix_ExploratoryLiveConnectAndPing$|^TestSQLMatrix_SchemaDrift_Exploratory$' -tags oracle
          bash scripts/ci/assert_run_selects.sh ./pkg/app '^TestSQLMatrix_AutoMigrate_Exploratory$' -tags oracle
          bash scripts/ci/assert_run_selects.sh ./internal/cli '^TestSQLMatrix_ExploratoryCriticalCommands$|^TestSQLMatrix_ExploratoryAdminUserCommands$' -tags oracle
          bash scripts/ci/assert_run_selects.sh ./pkg/model '^TestCRUDLive_' -tags oracle

      - name: Confirm Oracle port
        # The service healthcheck above already gates readiness (FREEPDB1
        # registered), so this is a fast belt-and-suspenders that the mapped
        # port is reachable from the job before the smoke — not the readiness
        # wait it used to be.
        run: |
          for _ in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1521) >/dev/null 2>&1; then
              echo "Oracle port is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Oracle port not reachable on 1521 despite healthy service"
          exit 1

      - name: Run live smoke (Oracle)
        env:
          NUCLEUS_SQL_EXPLORATORY_URL: 'oracle://system:oracle@127.0.0.1:1521/FREEPDB1'
        run: |
          bash scripts/ci/test_with_engines.sh -tags oracle ./pkg/db -run '^TestSQLMatrix_ExploratoryLiveConnectAndPing$|^TestSQLMatrix_SchemaDrift_Exploratory$' -v
          # ADR-011 resolved the Oracle identifier-casing bug: the scaffold
          # now emits UNQUOTED identifiers (Oracle folds to UPPERCASE),
          # matching the migrations bootstrap, the CRUD layer, and
          # USER_TAB_COLUMNS introspection — so an AutoMigrate'd table is
          # found by `WHERE TABLE_NAME = UPPER(...)`. The exploratory
          # AutoMigrate lane is re-enabled below.
          bash scripts/ci/test_with_engines.sh -tags oracle ./pkg/app -run '^TestSQLMatrix_AutoMigrate_Exploratory$' -v
          # AdminUserCommands: createuser/changepassword round-trip against a
          # real Oracle. Their shared single-row lookup emitted LIMIT 1 —
          # invalid in Oracle's grammar (ORA-00933) — until NU8-1 gave the
          # oracle branch FETCH FIRST 1 ROWS ONLY; this run is where that
          # branch actually executes.
          bash scripts/ci/test_with_engines.sh -tags oracle ./internal/cli -run '^TestSQLMatrix_ExploratoryCriticalCommands$|^TestSQLMatrix_ExploratoryAdminUserCommands$' -v

      # NU8-1: FindAll/FindByID emitted `LIMIT` on Oracle — invalid SQL
      # (ORA-00933) on a URL scheme the contract inventory declares stable.
      # Exactly like MSSQL in NU5-4, this lane ran no CRUD test, so the broken
      # grammar shipped unexecuted. This step keeps the CRUD read surface
      # (list with OFFSET…FETCH paging, get with FETCH FIRST, update,
      # soft-delete) executing against a real Oracle.
      - name: Run model CRUD live matrix (Oracle)
        env:
          NUCLEUS_SQL_MATRIX_URL: 'oracle://system:oracle@127.0.0.1:1521/FREEPDB1'
        run: bash scripts/ci/test_with_engines.sh -tags oracle ./pkg/model -run '^TestCRUDLive_' -v

  compatibility-harness:
    name: Compatibility Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run fixture compatibility harness
        run: |
          mkdir -p ci-reports
          bash scripts/ci/run_compatibility_harness.sh \
            --output ci-reports/compatibility_harness.md \
            --enforce-threshold

      - name: Upload compatibility harness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-harness-${{ github.run_id }}
          path: ci-reports/compatibility_harness.md
          if-no-files-found: error

  contract-freeze:
    name: Contract Freeze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Validate stable contract freeze baselines
        run: bash scripts/ci/check_contract_freeze.sh

  website-drift:
    name: Website Docs Drift (advisory)
    runs-on: ubuntu-latest
    # Advisory only — intentionally NOT in ci-required-gate.needs. Runs on
    # every push so removed/renamed public symbols referenced by the public
    # site (dangling `covers:` refs) or reintroduced legacy tokens surface
    # immediately. Faithfulness omissions (new surface, silent site) are not
    # machine-checkable here — those are the website-curator subagent's job.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check website/docs drift vs shipped surface
        run: bash scripts/website/check-coverage.sh --strict

  # A3. The single check name branch protection requires on `main`. Registering
  # a lane is one edit — its job id in the `needs:` list below. The step reads
  # the results out of the `needs` context itself rather than repeating the ids
  # in shell, so a lane can no longer sit in `needs:` while silently missing
  # from the check.
  ci-required-gate:
    name: CI Required Gate
    runs-on: ubuntu-latest
    # `always()` so the gate still runs, and still reports, when one of its
    # needs failed or was cancelled. Without it the gate would itself be
    # skipped, and a skipped required check does not block a pull request —
    # the gate would go green by not running.
    if: always()
    needs:
      - test
      - db-matrix-required
      - jobs-redis
      - storage-minio
      - modules-standalone
      - cli
      - hello-world-size
      - suite-starter
      - providers-ldap
      - providers-saml
      - db-matrix-live-mssql
      - db-matrix-live-oracle
      - compatibility-harness
      - contract-freeze

    steps:
      - name: Evaluate required CI results
        env:
          # The whole `needs` context as JSON. Every job id in the list above
          # appears here as a key, so the evaluation below is generated from
          # that list and cannot drift from it. `.result` is one of success,
          # failure, cancelled or skipped — a closed set written by the runner,
          # so nothing user-controlled reaches the script.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # Fail closed on anything that is not a populated object. `needs:` is
          # never empty, so an empty or unreadable context means the gate
          # judged nothing — and a gate that judged nothing must not be green.
          if ! count="$(printf '%s' "$NEEDS_JSON" | jq -e 'if type == "object" then length else error("needs context is not an object") end')"; then
            echo "::error::CI Required Gate: could not read the needs context as JSON; refusing to pass."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::CI Required Gate: the needs context is empty, so no job was judged; refusing to pass."
            exit 1
          fi

          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key) result: \(.value.result)"' | sort

          # `skipped` passes: a lane whose own `if:` was false did not run and
          # has nothing to report, so holding the merge on it would be
          # dishonest. Everything else fails — `failure` obviously, and
          # `cancelled` too, because a lane that was stopped proves nothing and
          # must not be read as green.
          not_ok="$(
            printf '%s' "$NEEDS_JSON" | jq -r '
              [ to_entries[]
                | select(.value.result != "success" and .value.result != "skipped")
                | "\(.key) (\(.value.result))"
              ] | sort | join(", ")
            '
          )"

          if [ -n "$not_ok" ]; then
            # Every offender, not just the first, so one red run tells the whole
            # story instead of one lane per re-run.
            echo "::error::CI Required Gate: required jobs that did not succeed: $not_ok"
            exit 1
          fi

          echo "Judged $count required jobs. All required CI jobs passed."
