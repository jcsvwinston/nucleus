name: Release Rehearsal

on:
  workflow_dispatch:

# The rehearsal builds a release candidate and publishes nothing: checkout,
# a build script and an artifact upload. Read-only is enough.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rehearsal:
    name: Rehearse RC (No Publish)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Run Rehearsal Script
        run: ./scripts/release/rehearse_rc.sh

      - name: Upload Release Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-release-reports
          path: |
            dist/reports/compatibility_report.md
            dist/reports/dependency_impact_report.md
          if-no-files-found: error
