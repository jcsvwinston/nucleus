name: Release

# `push: tags` only fires for tags pushed with user credentials. Tags cut by
# release-please are created with the GITHUB_TOKEN, whose events GitHub
# suppresses (workflow-recursion guard), so the Release Please workflow
# chains this one via workflow_dispatch at the tag ref — github.ref_name is
# the tag either way, and every step below keys off it.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Read-only by default: the `verify` job below only checks out, tests and
# uploads reports, so this block is what stops it from running write-enabled.
# `publish` already declared `contents: write` in its own block and keeps it —
# that is the job that creates the release assets.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run Go Tests
        run: go test ./...

      - name: Generate compatibility report
        run: |
          mkdir -p release-reports
          bash scripts/release/generate_compatibility_report.sh \
            --output release-reports/compatibility_report.md \
            --enforce-threshold

      - name: Generate dependency impact report
        run: |
          mkdir -p release-reports
          bash scripts/release/generate_dependency_impact_report.sh \
            --output release-reports/dependency_impact_report.md

      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reports-${{ github.ref_name }}
          path: |
            release-reports/compatibility_report.md
            release-reports/dependency_impact_report.md
          if-no-files-found: error

  publish:
    name: Publish Artifacts
    needs: verify
    runs-on: ubuntu-latest
    # Kept at write: goreleaser creates the GitHub Release and uploads the six
    # archives plus checksums.txt, and the "Check Existing Release" step below
    # reads the releases API with the same token. Both live on `contents`.
    permissions:
      # All four are load-bearing and none replaces another: `contents` is
      # what GoReleaser uploads the assets with, `id-token` is the OIDC token
      # cosign signs with (keyless: no key lives in this repository),
      # `attestations` is what writes the build provenance, and `packages` is
      # what pushes the container image to GHCR and what cosign writes the
      # image signature with. Dropping any one of them fails a different step.
      contents: write
      id-token: write
      attestations: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true

      # goreleaser-action installs neither of these, and the config calls both
      # by bare name. Installing them before GoReleaser runs means a missing
      # tool fails here, in one line, instead of halfway through a release.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # The runner's default builder uses the `docker` driver, which cannot
      # push a manifest list. This creates a docker-container builder, which
      # can. No QEMU is set up alongside it on purpose: the Dockerfile's
      # `release` target runs no command, it only copies an already-built
      # binary, so the linux/arm64 leg needs nothing emulated.
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # GHCR credentials are wanted three times over: by the guard below,
      # which asks the registry whether the image for this tag already exists;
      # by the push itself; and by cosign, which writes the image signature
      # into the same repository. Logging in once here covers all three.
      - name: Log In To GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag arithmetic in one place. The version tag is always published;
      # `latest` only when the version carries no prerelease suffix, so a
      # `v2.0.0-rc.1` never becomes what a bare `docker pull` hands out.
      # GHCR paths must be lowercase and `github.repository` is used verbatim:
      # renaming this repository to anything with capitals would need a
      # lowercasing step here.
      - name: Image Coordinates
        id: image_meta
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v*.*.*) ;;
            *)
              echo "::error::${GITHUB_REF_NAME} is not a vX.Y.Z tag; this job releases tags only."
              exit 1
              ;;
          esac

          image="ghcr.io/${GITHUB_REPOSITORY}"
          version="${GITHUB_REF_NAME#v}"
          tags="${image}:${version}"
          case "${version}" in
            *-*) prerelease=true ;;
            *)
              prerelease=false
              tags="${tags}"$'\n'"${image}:latest"
              ;;
          esac

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "tags<<TAGS_EOF"
            echo "${tags}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "image=${image} version=${version} prerelease=${prerelease}"

      # This guard used to ask only whether the release had any assets at
      # all. With signing in the pipeline that question stopped being the
      # right one: a run that uploaded the six archives and then failed to
      # sign left a release that "has assets", so every re-run skipped it and
      # the release stayed unsigned for good. It now asks whether the release
      # is COMPLETE — archives, one SBOM per archive, the checksum file, its
      # signature and its certificate — and re-runs GoReleaser until it is.
      - name: Check Existing Release
        id: release_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.image_meta.outputs.image }}:${{ steps.image_meta.outputs.version }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          if [ "$STATUS" = "200" ]; then
            jq -r '.assets[].name' /tmp/release.json > /tmp/assets.txt
          else
            : > /tmp/assets.txt
          fi

          count() { grep -cE "$1" /tmp/assets.txt || true; }
          archives=$(count '\.(tar\.gz|zip)$')
          sboms=$(count '\.spdx\.json$')
          checksums=$(count '^checksums\.txt$')
          signature=$(count '^checksums\.txt\.sig$')
          certificate=$(count '^checksums\.txt\.pem$')

          echo "archives=$archives sboms=$sboms checksums=$checksums signature=$signature certificate=$certificate"

          if [ "$archives" -eq 0 ] || [ "$sboms" -ne "$archives" ] ||
             [ "$checksums" -ne 1 ] || [ "$signature" -ne 1 ] || [ "$certificate" -ne 1 ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The assets are all there. The provenance attestation is NOT an
          # asset — it lives in the attestations API — so the asset list
          # cannot see it, and a run that signed and then failed to attest
          # would look finished forever. Ask for it by the digest of the
          # first archive the published checksum file lists: the attestation
          # covers every entry in that file.
          asset_url=$(jq -r '.assets[] | select(.name == "checksums.txt") | .url' /tmp/release.json)
          curl -sSL -o /tmp/published_checksums.txt \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$asset_url"
          digest=$(awk '$2 ~ /\.tar\.gz$/ { print $1; exit }' /tmp/published_checksums.txt)
          attested=0
          if [ -n "$digest" ]; then
            ATT_STATUS=$(curl -sS -o /tmp/attestations.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/attestations/sha256:${digest}")
            if [ "$ATT_STATUS" = "200" ]; then
              attested=$(jq -r '(.attestations // []) | length' /tmp/attestations.json)
            fi
          fi
          echo "attestations=$attested for sha256:${digest:-<none>}"

          # The container image is the other thing a complete release carries
          # that is not a release asset. Ask the registry rather than the
          # releases API; a tag that has never been pushed answers with a
          # failure, which is the same as "not complete".
          image_present=0
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            image_present=1
          fi
          echo "image_present=$image_present for $IMAGE_REF"

          if [ "$attested" -gt 0 ] && [ "$image_present" -eq 1 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish With GoReleaser
        if: steps.release_check.outputs.complete != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.14.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser has just produced linux/amd64 and linux/arm64 binaries for
      # this tag. Laying them out as <os>/<arch>/nucleus in a context of their
      # own is what lets the image build compile nothing a second time: the
      # binary that goes into the image is the same file the release archives
      # carry, and checksums.txt — the file the signature covers — accounts
      # for those archives.
      #
      # The GOAMD64/GOARM64 suffix GoReleaser appends to the directory name
      # (`_v1`, `_v8.0`) is a default that can move between versions, so match
      # a glob and fail here if it stops resolving to exactly one binary.
      - name: Stage Binaries For The Image
        if: steps.release_check.outputs.complete != 'true'
        run: |
          set -euo pipefail
          stage() {
            arch="$1"
            # An unmatched glob stays literal, so the -f test below is what
            # catches "no such directory" as well as "more than one".
            set -- dist/nucleus_linux_"${arch}"*/nucleus
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::dist/nucleus_linux_${arch}*/nucleus did not resolve to exactly one binary"
              exit 1
            fi
            mkdir -p "image-context/linux/${arch}"
            cp "$1" "image-context/linux/${arch}/nucleus"
            chmod 0755 "image-context/linux/${arch}/nucleus"
            echo "linux/${arch} <- $1"
          }
          stage amd64
          stage arm64

      - name: Build And Push Image
        id: image
        if: steps.release_check.outputs.complete != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The build context is the staging directory rather than the
          # checkout, so nothing but the two binaries can reach the image —
          # and the Dockerfile, which lives at the repository root, has to be
          # named by absolute path.
          context: image-context
          file: ${{ github.workspace }}/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=nucleus
            org.opencontainers.image.description=The nucleus CLI.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image_meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          # BuildKit can attach provenance and SBOM attestations of its own to
          # the pushed index. Both are off: the release already publishes an
          # SPDX SBOM per archive and the step below writes the provenance
          # attestation for the image, and leaving BuildKit's on adds
          # unknown/unknown platform entries to the manifest list for no gain.
          provenance: false
          sbom: false

      # Same keyless scheme as the archives: the identity is the OIDC token
      # minted for this job, so what a consumer checks is which workflow, in
      # which repository, at which tag pushed the image. cosign is handed the
      # digest rather than a tag, so the signature cannot drift onto whatever
      # `:latest` points at later. It signs the multi-architecture index; a
      # consumer verifying the tag resolves to that same index.
      - name: Sign Image
        if: steps.release_check.outputs.complete != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image_meta.outputs.image }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST"

      - name: Attest Image Provenance
        if: steps.release_check.outputs.complete != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image_meta.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}

      # One attestation over the checksum file covers every artifact listed in
      # it — the six archives and the six SBOMs — instead of one round trip
      # per artifact. `gh attestation verify <archive>` resolves it by digest,
      # so a consumer never has to know that.
      - name: Attest Build Provenance
        if: steps.release_check.outputs.complete != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Skip Publish (Already Released)
        if: steps.release_check.outputs.complete == 'true'
        run: |
          echo "Release ${GITHUB_REF_NAME} already carries signed, attested artifacts and a published image."
