name: Repin Showcase

# §2 of the QCD-debt arc (2026-08-30). Every sibling tag used to turn
# check_example_pins red on EVERY open PR at once (showcase-smoke feeds CI
# Required Gate); the 1.23.0 train needed six manual re-pin chores. The
# pins guard now tolerates one minor of lag, and this workflow closes the
# lag mechanically: it re-pins examples/ to the latest published tags and
# opens (or updates) the chore PR.
#
# Triggers:
#   - workflow_run after "Release Please": tags cut by release-please come
#     from the GITHUB_TOKEN, whose events GitHub suppresses (recursion
#     guard), so neither `release:` nor `push: tags` would ever fire here.
#     workflow_run is a meta-event and fires regardless. Release Please
#     runs on every main push, so most firings find nothing to do and exit
#     quietly — that laziness is also what heals a sibling lag after any
#     main activity.
#   - workflow_dispatch: for the train-end re-pin, and after a SIBLING repo
#     tags (sibling repos cannot trigger us without a cross-repo token).
#
# PRs created with the GITHUB_TOKEN do not trigger `pull_request` workflows
# (same recursion guard), so this workflow dispatches ci.yml explicitly on
# the branch: the check runs land on the head SHA and satisfy the required
# gate.

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repin-showcase
  cancel-in-progress: false

jobs:
  repin:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Write stays here, on the only job of the workflow: contents for the
    # `git push --force origin chore/repin-showcase`, pull-requests for the
    # `gh pr list` / `gh pr create` that opens the chore PR, and actions for
    # the `gh workflow run ci.yml` that dispatches CI on that branch (PRs
    # created with the GITHUB_TOKEN do not trigger `pull_request` workflows).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Go
        # `cache: false` ON PURPOSE, and it is not a micro-optimisation: with
        # the cache on, this job POISONS the module and build cache that every
        # other job in the repository restores.
        #
        # setup-go keys its cache on the toolchain plus go.sum, so all jobs
        # share one key, and only the first to finish saves it — every later
        # job logs "Cache hit occurred on the primary key, not saving cache".
        # This job is the first to finish by a wide margin. It runs on
        # `workflow_run` after Release Please, which fires on EVERY push to
        # main, and its header above says most firings find nothing to do:
        # the re-pin step then takes a second and the whole job is over in
        # under twenty, while the CI jobs that would save a real cache are
        # still installing services.
        #
        # And it has nothing to save. `repin_examples.sh` only runs
        # `go mod edit` and `go mod tidy`, inside a loop over the modules that
        # are actually behind — on a quiet firing that loop body never runs,
        # so both cache directories are still empty when the post step
        # uploads them.
        #
        # Measured: run 34281497515 on 2026-09-08 saved 7,675 bytes under
        # `setup-go-Linux-x64-ubuntu24-go-1.26.6-dd1a3c9d…` at 21:36:41Z, one
        # second after its post step began. The same key holds 364 MB on
        # refs/pull/493/merge. Every PR job then restored the 7,675-byte entry
        # ("Cache Size: ~0 MB"), reported a hit, and went on to download the
        # module graph from scratch: 73 `go: downloading` lines in a single
        # "Test And Smoke" job.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Re-pin examples to the latest published sibling tags
        run: bash scripts/release/repin_examples.sh

      - name: Open or update the chore PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "pins already at the latest tags — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=chore/repin-showcase
          git checkout -B "$BRANCH"
          git add examples/
          git commit -m "chore(examples): re-pin the showcase to the latest published tags"
          git push --force origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --head "$BRANCH" \
              --title "chore(examples): re-pin the showcase to the latest published tags" \
              --body "Abierto por el workflow repin-showcase: el guard de pins tolera un minor de lag y este chore lo cierra. El CI del PR se dispara vía workflow_dispatch (los PRs del GITHUB_TOKEN no lanzan workflows)."
          fi
          gh workflow run ci.yml --ref "$BRANCH"
