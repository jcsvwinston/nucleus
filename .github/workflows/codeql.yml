name: CodeQL

# Static analysis (SAST) of this repository's Go, reported as code-scanning
# alerts.
#
# Until this file, nothing in THIS repository looked for the classes of defect
# a taint analysis finds. `go vet` runs in CI and is worth having, but it reads
# one function at a time: it cannot say that a value read from a request
# reaches an SQL string, a file path or an exec argument several calls later.
# That gap is also what OpenSSF Scorecard's SAST check measures, and it scored
# zero here (see scorecard.yml). Quark, for the record, has had CodeQL since
# May through GitHub's default setup — a repository setting, which is why
# grepping the workflows of the suite reported no SAST anywhere.
#
# It reports; it does not gate. Alerts show up in the pull request's "Files
# changed" tab and in the Security tab, and no lane fails because of one.
# Making a query block a merge is a repository setting, not a line in this
# file — deliberately, because the first weeks of a new analysis are mostly
# about learning which of its queries are worth listening to here.
#
# Every `uses:` below is pinned to a commit SHA with its release tag in the
# trailing comment, and .github/dependabot.yml (github-actions ecosystem) is
# what moves those pins. See SECURITY.md, "The build's own supply chain".

on:
  # Every merge re-establishes the baseline. GitHub reports a pull request's
  # alerts as *new* relative to the most recent analysis of the base branch,
  # so this trigger is what keeps that comparison point one merge old instead
  # of up to a week old: without it, a branch opened on a Friday is diffed
  # against Tuesday's `main` and inherits, as "new on this branch", every
  # alert merged in between — and an alert a merge fixed stays open on the
  # default branch until the next Tuesday. It is also what the CodeQL action
  # asks for: with only `pull_request` and `schedule`, every run logs
  # "##[warning] ... Please specify an on.push hook to analyze and see code
  # scanning alerts from the default branch on the Security tab."
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # The catch-all for what no merge can trigger: the query pack moves on its
    # own, and a new query can raise an alert on code nobody has touched since
    # the last analysis. Off the hour, and off Monday 06:27, which is when
    # scorecard.yml asks for a runner.
    - cron: "13 4 * * 2"
  workflow_dispatch:

# Read-only by default. The single job below raises exactly what it needs.
permissions:
  contents: read

# Three pushes in ten minutes do not need three analyses of the first two
# commits. Only pull request runs are superseded; a run on `main`, pushed or
# scheduled, is a baseline and is never cancelled.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    # The lane measures a bit over two minutes of runner time — 2 min 07 s and
    # 2 min 24 s on the first two runs of the pull request that added this
    # file. Both ran with actions/setup-go's module and build caches restored
    # from a hit, which is the ordinary state on a repository that builds this
    # often, so these are warm-cache numbers; a genuinely cold cache adds the
    # module download and a full compile of the dependency graph on top. Wall
    # clock is longer again when the queue is busy, and that is queue time,
    # not work. The cap is not a target, it is a stop: an extractor that
    # wedges should cost twenty minutes of runner time, not six hours.
    timeout-minutes: 20
    permissions:
      # The only write in the file: upload the results as code-scanning
      # alerts. A job-level block REPLACES the workflow-level one rather than
      # adding to it, which is why `contents: read` is repeated here.
      security-events: write
      # Checkout.
      contents: read
      # `actions: read` is what the CodeQL action documents for private
      # repositories, where it needs to read workflow runs. This repository is
      # public, so it is left out rather than granted "just in case".

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. A credential left in .git/config would be
          # readable by every later step, the analysis included.
          persist-credentials: false

      - name: Setup Go
        # Before `init` on purpose. CodeQL traces the build below, so the
        # toolchain that build uses must be the one this module declares —
        # not whatever Go the runner image happens to ship this month.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          # Not `autobuild`: this tree holds fifteen go.mod files (the
          # framework at the root, the twelve optional modules under drivers/,
          # exporters/ and providers/, and the two examples), and the
          # autobuilder's job is to guess which one a tree means. A guess that
          # lands on the wrong go.mod fails loudly; one that decides to build
          # all of them is a multi-module build nobody asked for. `manual`
          # makes the next step the answer.
          build-mode: manual
          # No CodeQL `paths-ignore` here, and not by oversight: GitHub
          # documents those filters as applying to interpreted languages and
          # to compiled languages analysed without a build. Go is neither, so
          # the build below is the filter — what it compiles is what gets
          # extracted. There is nothing vendored in this tree (no vendor/
          # directory) and no generated Go in the root module, so there is
          # nothing the build should be excluding either.

      - name: Build the framework module
        # This command IS the scope of the analysis. On a Linux runner it
        # compiles 228 non-test .go files — 163 under pkg/, 61 under
        # internal/, 2 under cmd/ and 2 under scripts/ — of the 255 in the
        # tree.
        #
        # contracts/ is deliberately absent from that list: all eleven of its
        # .go files are `_test.go`, `go build` does not compile tests, and the
        # Go extractor ships `extract_tests: false`, so not a line of it is
        # extracted. That is the same reason `go build` is used here and not
        # `go test -c` — the alerts should be about shipped code, not
        # fixtures.
        #
        # The twelve optional modules are thin adapters over third-party
        # drivers and are left out on purpose, as are the two examples: each
        # one added to this lane costs another extraction for a few hundred
        # lines. Widening the scope means a matrix over the modules; start
        # where the code is.
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # Explicit, though it is also the default for a single language:
          # the category is the key GitHub uses to tell one analysis from
          # another, and a second lane (another module, another language)
          # must not overwrite this one's alerts.
          category: "/language:go"
