# Dependency update proposals, weekly, grouped so a Monday brings one PR per
# ecosystem rather than one per module. The framework module and each sibling
# module (drivers, exporters, providers) are separate Go modules and are
# listed separately; the examples pin released suite tags on purpose and are
# re-pinned by scripts/release/repin_examples.sh, not by Dependabot.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories:
      - /drivers/mssql
      - /drivers/mysql
      - /drivers/oracle
      - /drivers/postgres
      - /drivers/sqlite
      - /exporters/otlp
      - /exporters/prometheus
      - /providers/ldap
      - /providers/secrets-aws
      - /providers/storage-azure
      - /providers/storage-gcs
      - /providers/storage-s3
    schedule:
      interval: weekly
    groups:
      sibling-modules:
        patterns: ["*"]
    ignore:
      # The nucleus pin in a sibling module moves with the release train
      # (the module and the API it consumes ship in the same train).
      - dependency-name: github.com/jcsvwinston/nucleus
  # Every `uses:` in .github/workflows is pinned to a 40-hex commit SHA with
  # the release tag in a trailing comment. A SHA does not move on its own, so
  # this entry is what keeps the pins fresh: Dependabot reads the comment to
  # learn which version is pinned, and a new release arrives as a PR that
  # rewrites both the SHA and the comment. Without this entry the pins would
  # be a snapshot of today, which is worse than a tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
