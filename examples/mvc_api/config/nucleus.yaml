port: 8090
log_level: info
log_format: text

databases:
  default:
    url: "sqlite://examples_mvc_api.db"

session_cookie_secure: false

# The example runs with the scaffold's barriers on: default-deny RBAC and
# CSRF. The notes module declares the policy rows and the CSRF exemption
# its own routes need (internal/notes/module.go), so the host policy file
# grants only the built-in health endpoint.
rbac_policy_file: "config/rbac_policy.csv"
csrf_enabled: true
