# Runs the module's tests — the CheckModule conformance test among them — on
# every push to main and every pull request. The actions are pinned to a
# commit, with the tag beside it; .github/dependabot.yml proposes the next
# pin, so a pin never freezes an action on the day it was written.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
