version: 2

project_name: nucleus

builds:
  - id: nucleus
    main: ./cmd/nucleus
    binary: nucleus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jcsvwinston/nucleus/internal/cli.Version={{ .Version }}

archives:
  - id: cli-binaries
    ids:
      - nucleus
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive. The SBOM pipe runs BEFORE the checksum pipe, so
# the six .spdx.json documents are listed in checksums.txt alongside the six
# archives — which is why signing that one file covers every artifact we
# publish. Neither goreleaser nor goreleaser-action ships syft: the release
# workflow downloads it before this runs, and without it the release fails
# loudly here rather than publishing archives with no SBOM beside them.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args:
      - scan
      - "$artifact"
      - --output
      - spdx-json=$document

# Keyless signature over the checksum file. The signing identity is the OIDC
# token GitHub mints for the release job, so there is no key to hold and no
# secret to rotate; what a consumer checks is which workflow, in which
# repository, at which ref produced the signature. Release Please dispatches
# that workflow at the TAG ref, so the identity ends in
# `.../release.yml@refs/tags/vX.Y.Z` — see the verification page under
# website/docs/operations for the command that consumes this.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

# There is deliberately no `dockers:`/`docker_manifests:` block here. The
# container image is built by the release workflow once GoReleaser has
# finished, out of the linux/amd64 and linux/arm64 binaries the `builds:`
# block above produced — the same files the archives carry, so nothing is
# compiled twice and the image holds the binary that checksums.txt (and
# therefore the signature over it) accounts for. GoReleaser's docker pipe
# reaches those binaries too, but it publishes one tag per architecture and
# joins them afterwards with a manifest list; the workflow needs the digest of
# that list to sign and attest the image, and it takes it straight out of the
# build step instead. See "Build And Push Image" in
# .github/workflows/release.yml.

release:
  # The idempotency guard in the release workflow re-runs GoReleaser when a
  # release carries archives but not the signature, the certificate or the
  # SBOMs. That re-run has to be able to overwrite the assets the failed run
  # already uploaded, or the repair it exists for cannot happen.
  replace_existing_artifacts: true

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  disable: true
